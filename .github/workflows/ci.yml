# ============================================================
# GitHub Actions · PV-system-project
# 位置：仓库根目录 .github/workflows/ci.yml
#
# 目录假设：
#   calc/   → pyproject.toml（uv 管理）
#   server/ → pom.xml（Spring Boot 3 + JDK 21）
#   web/    → package.json（Vite + Vue 3）
#
# 某个子目录还没建好时，对应 job 自动跳过（灰点，不是红叉）
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 网页上也能手动触发

# 同一分支连推多次时取消旧 workflow，省额度也省排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  JAVA_VERSION: "21"

jobs:
  # ==========================================================
  # 0. 探测哪些子项目存在
  #    说明：hashFiles() 在 job 级 if 里不可用（那时还没有 checkout），
  #    所以必须单独开一个 job 先 checkout 再用 shell 判断。
  # ==========================================================
  detect:
    name: Detect projects
    runs-on: ubuntu-latest
    outputs:
      calc: ${{ steps.check.outputs.calc }}
      server: ${{ steps.check.outputs.server }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          [ -f calc/pyproject.toml ]                        && echo "calc=true"   >> $GITHUB_OUTPUT || echo "calc=false"   >> $GITHUB_OUTPUT
          [ -f server/pom.xml ]                             && echo "server=true" >> $GITHUB_OUTPUT || echo "server=false" >> $GITHUB_OUTPUT
          [ -f web/package.json ]                           && echo "web=true"    >> $GITHUB_OUTPUT || echo "web=false"    >> $GITHUB_OUTPUT

  # ==========================================================
  # 1. Python 计算服务（pandapower / FastAPI）
  # ==========================================================
  python-test:
    name: Python · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect
    if: needs.detect.outputs.calc == 'true'
    defaults:
      run:
        working-directory: calc

    steps:
      - uses: actions/checkout@v4

      # astral 官方 action：装 uv + 缓存 wheel
      # 缓存命中时 pandapower 这类大包不用重下
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: calc/uv.lock

      - name: 安装依赖
        # 有 lock 就严格按 lock（可复现）；没有则正常解析
        run: |
          if [ -f uv.lock ]; then
            uv sync --frozen
          else
            uv sync
          fi

      - name: 运行测试
        # --if-present 语义靠 shell 判断，避免没有 tests 目录时直接报错
        run: |
          if [ -d tests ] || [ -f test_smoke.py ]; then
            uv run pytest -q
          else
            echo "::notice::还没有 tests 目录，跳过 pytest"
          fi

  # ==========================================================
  # 2. Java 业务服务（Spring Boot 3）
  # ==========================================================
  java-test:
    name: Java · mvn test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: detect
    if: needs.detect.outputs.server == 'true'
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: 编译并测试
        # -B 批处理模式（日志干净）；-ntp 不打印下载进度
        # 不加 -T 1C：CI 只有 2 核，并行构建反而更慢
        run: mvn -B -ntp test

  # ==========================================================
  # 3. 前端（Vue 3 + Vite）
  # ==========================================================
  web-build:
    name: Web · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect
    if: needs.detect.outputs.web == 'true'
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 手写缓存：不用 setup-node 的 cache: npm
      # 因为 lock 文件不存在时它会让整个 job 直接报错
      - name: 缓存 npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::notice::没有 package-lock.json，回退到 npm install"
            npm install --no-audit --no-fund
          fi

      - name: 构建
        run: npm run build --if-present

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: warn

  # ==========================================================
  # 4. 汇总门禁
  #    分支保护只勾这一个检查项，比勾三个好维护
  # ==========================================================
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [python-test, java-test, web-build]
    if: always()

    steps:
      - name: 检查各 job 结果
        run: |
          echo "python-test : ${{ needs.python-test.result }}"
          echo "java-test   : ${{ needs.java-test.result }}"
          echo "web-build   : ${{ needs.web-build.result }}"

          failed=0
          for r in \
            "${{ needs.python-test.result }}" \
            "${{ needs.java-test.result }}" \
            "${{ needs.web-build.result }}"; do
            case "$r" in
              failure|cancelled) failed=1 ;;
            esac
          done

          if [ "$failed" = "1" ]; then
            echo "::error::至少一个 job 失败或被取消"
            exit 1
          fi
          echo "通过（skipped 视为通过，表示该子项目还没建）"
