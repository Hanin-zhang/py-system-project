[project]
name = "gp-hosting"
version = "0.1.0"
description = "配电网分布式光伏承载力评估与治理决策平台 - 计算服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandapower>=2.14,<2.15",
    # pandapower 2.14 内部 `from numpy import Inf`，该别名在 NumPy 2 中已删除，必须锁 1.x
    "numpy>=1.26,<2.0",
    "pandas>=2.0,<3.0",
    "pyarrow>=14,<19",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
